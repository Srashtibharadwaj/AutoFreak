<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
	<script src=
"https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js">
	</script>
	<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js">
	</script>
</head>
<body>
    <nav class="navbar navbar-inverse">
		<div class="container-fluid">
			<div class="navbar-header">
				<a class="navbar-brand" href="#">
					Auto-Freak</a>
			</div>
			<ul class="nav navbar-nav">
				
				<li><a href="{% url 'admin_dashboard' %}">Profile</a></li>
				<li><a href="{% url 'admin_employees' %}">Employees</a></li>
				<li><a href="{% url 'admin_car' %}">add drivers</a></li>
                <li><a href="{% url 'admin_addedoffers' %}">booking information</a></li>
		        
			</ul>
			<ul class="nav navbar-nav navbar-right">
                <li><a href="{% url 'admin_changepassword' %}">
					<span class="glyphicon glyphicon-user"></span>
					changepassword</a></li>
				
				<li><a href="#">
					<span class="glyphicon glyphicon-log-out"></span>
					Logout</a></li>
			</ul>
		</div>
	</nav>
	<!--grid-->
	<div class="grid-form1">
		<h3 id="forms-controls-static">Update your Password</h3>
		<form class="form-horizontal" action="{% url 'user_changepassword' %}" method="post">
		 {% csrf_token %}
		 <div class="form-group">
		  <label class="col-sm-2 control-label hor-form">Current Password</label>
		  <div class="col-sm-10">
		   <input type="password" name="cpassword" class="form-control" id="inputcpassword"
			placeholder="enter your currnent password">
		  </div>
		 </div>
		 <div class="form-group">
		  <label class="col-sm-2 control-label hor-form">New password</label>
		  <div class="col-sm-10">
		   <input type="password" name="npassword" class="form-control" id="inputnpassword"
			placeholder="Enter your new password">
		  </div>
		 </div>
		 <div class="form-group">
		  <label class="col-sm-2 control-label hor-form">Confirm Password</label>
		  <div class="col-sm-10">
		   <input type="password" name="conpassword" class="form-control" id="inputcpassword"
			placeholder="re-enter your password">
		  </div>
		 </div>
		 <button type="submit" class="btn btn-primary">Submit</button>
		 {{msg}}
		</form>
		<!--//grid-->
	  
	  <!-- script-for sticky-nav -->
		<script>
		$(document).ready(function() {
		  var navoffeset=$(".header-main").offset().top;
		  $(window).scroll(function(){
		  var scrollpos=$(window).scrollTop(); 
		  if(scrollpos >=navoffeset){
		   $(".header-main").addClass("fixed");
		  }else{
		   $(".header-main").removeClass("fixed");
		  }
		  });
		  
		});
		</script>
		<!-- /script-for sticky-nav -->
	  <!--inner block start here-->
	  <div class="inner-block">
	  
	  </div>
	  <!--inner block end here-->
	  <!--copy rights start here-->
	  <div class="copyrights">
		<p>© 2023-24 CareFirst . All Rights Reserved | Design by Autofreak </p>
	  </div> 
	  <!--COPY rights end here-->
	  </div>
	  </div>
		<!--//content-inner-->
		<!--/sidebar-menu-->
		
		<div class="clearfix"></div>
	   </div>
			 <script>
			 var toggle = true;
				
			 $(".sidebar-icon").click(function() {                
			   if (toggle)
			   {
			  $(".page-container").addClass("sidebar-collapsed").removeClass("sidebar-collapsed-back");
			  $("#menu span").css({"position":"absolute"});
			   }
			   else
			   {
			  $(".page-container").removeClass("sidebar-collapsed").addClass("sidebar-collapsed-back");
			  setTimeout(function() {
				$("#menu span").css({"position":"relative"});
			  }, 400);
			   }
				 
				 toggle = !toggle;
				});
			 </script>
	</body>
</html>
